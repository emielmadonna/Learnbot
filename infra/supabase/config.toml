project_id = "learningbot-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://clone.stack-labs.ai"
additional_redirect_urls = [
  "http://localhost:3001/auth/callback",
  "http://localhost:3001/auth/invite",
  "http://127.0.0.1:3100",
  "http://127.0.0.1:3100/auth/callback",
  "https://clone.stack-labs.ai",
  "https://clone.stack-labs.ai/auth/callback",
  "https://clone.stack-labs.ai/auth/invite",
  "https://learningbot-estie-preview.vercel.app/auth/callback",
  "https://learningbot-estie-preview-emiel-madonnas-projects.vercel.app/auth/callback",
  "https://learningbot-estie-preview-git-co-984d79-emiel-madonnas-projects.vercel.app/auth/callback",
  "https://learningbot-estie-preview-h48grnkd8-emiel-madonnas-projects.vercel.app/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
# Keep email/password enabled for managed accounts. Public registration remains
# disabled by auth.enable_signup above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/learningbot_custom_access_token_hook"

[functions.learning-embeddings]
verify_jwt = true

[functions.learning-embedding-worker]
# Service-to-service operation capability is verified in constant time inside
# the function and again by every database RPC it calls.
verify_jwt = false

[functions.learning-admin-users]
verify_jwt = true

[functions.learning-provider-credentials]
verify_jwt = true

[functions.learning-provider-voice]
verify_jwt = true

# Provider completion is authenticated inside the function with the verified
# Supabase user plus the rotating, operation-scoped server token.
[functions.learning-provider-complete]
verify_jwt = false

# Anonymous widget and hosted turns cannot carry a Supabase user JWT. This
# endpoint instead requires the widget delivery key, exact allowed Origin and
# the rotating conversation operation token before provider access is resolved.
[functions.learning-provider-widget-complete]
verify_jwt = false

# This is intentionally not JWT-gated because it is authenticated by the
# tenant-bound, expiring, one-use owner claim. Once claimed, it fails closed.
[functions.learning-bootstrap-owner]
verify_jwt = false
