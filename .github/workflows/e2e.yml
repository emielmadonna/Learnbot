name: E2E

# Runs the Playwright suite against a deployed console. It is not part of
# `pnpm check`, because it needs a live deployment, a widget key whose
# allow-list contains that deployment's origin, and per-persona credentials.
# The public project needs only the URL; the persona projects skip, with a
# reason, for any persona whose secrets are absent.
#
# Mutating journeys (E2E_ALLOW_MUTATIONS=1) must never point at production.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Console origin to test"
        required: true
        default: "https://clone.stack-labs.ai"
      allow_mutations:
        description: "Let teacher/admin journeys create and change things (never on production)"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @course-ai/e2e exec playwright install --with-deps chromium
      - name: Run the suite
        env:
          CI: "1"
          E2E_BROWSER_CHANNEL: chromium
          E2E_BASE_URL: ${{ inputs.base_url || 'https://clone.stack-labs.ai' }}
          E2E_ALLOW_MUTATIONS: ${{ inputs.allow_mutations && '1' || '' }}
          E2E_WIDGET_KEY: ${{ secrets.E2E_WIDGET_KEY }}
          E2E_HOSTED_SLUG: ${{ secrets.E2E_HOSTED_SLUG }}
          E2E_LEARNER_EMAIL: ${{ secrets.E2E_LEARNER_EMAIL }}
          E2E_LEARNER_PASSWORD: ${{ secrets.E2E_LEARNER_PASSWORD }}
          E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
          E2E_TEACHER_TENANT: ${{ secrets.E2E_TEACHER_TENANT }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: pnpm --filter @course-ai/e2e e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
